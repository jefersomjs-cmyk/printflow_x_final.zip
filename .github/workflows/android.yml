name: Criar PrintFlow X

on:
  workflow_dispatch:
  push:
    branches:
      - principal
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Descompactar projeto
        run: |
          unzip -q printflow_x_final.zip -d projeto

      - name: Localizar projeto
        run: |
          PROJECT_DIR=$(find projeto -name pubspec.yaml -print -quit | xargs dirname)
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Projeto encontrado em: $PROJECT_DIR"

      - name: Criar estrutura Android
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter create --platforms=android .

      - name: Corrigir textos com R$
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          sed -i 's/R\$/R\\$/g' lib/main.dart

      - name: Instalar dependências
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter pub get

      - name: Compilar APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter build apk --release

      - name: Copiar APK
        run: |
          cp "${PROJECT_DIR}/build/app/outputs/flutter-apk/app-release.apk" ./printflow-x.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: printflow-x-apk
          path: printflow-x.apk
