name: Build PrintFlow X

on:
  workflow_dispatch:
  push:
    branches:
      - principal
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Preparar projeto
        run: |
          unzip -q printflow_x_final.zip -d projeto
          PROJECT_DIR=$(find projeto -name pubspec.yaml -print -quit | xargs dirname)
          echo "Projeto encontrado em: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Instalar dependências
        run: flutter pub get
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Compilar APK
        run: flutter build apk --release
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Preparar APK
        run: |
          APK=$(find "${PROJECT_DIR}" -path "*/build/app/outputs/flutter-apk/app-release.apk" -print -quit)
          cp "$APK" ./printflow-x.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: printflow-x-apk
          path: printflow-x.apk
